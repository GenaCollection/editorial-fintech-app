<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--seo-->
    <title>ArmFinCredit — Loan Calculator Armenia (AMD) with AI Advisor</title>
    <meta name="description" content="Free loan calculator for Armenia in drams: monthly payment, amortization schedule, early repayment, real APR, loan comparison and an AI advisor. In Armenian, Russian and English." />
    <link rel="canonical" href="https://www.armfincredit.site/" />
    <meta property="og:title" content="ArmFinCredit — Loan Calculator Armenia (AMD) with AI Advisor" />
    <meta property="og:description" content="Monthly payment, amortization schedule, early repayment and real APR in seconds. AM / RU / EN." />
    <meta property="og:url" content="https://www.armfincredit.site/" />
    <!--/seo-->
    <meta name="theme-color" content="#1d4ed8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph / social previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ArmFinCredit" />
    <meta property="og:image" content="https://www.armfincredit.site/og.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- AdSense site verification. The ad script itself is injected at runtime
         for free-plan users only (see src/components/AdSlot.jsx). -->
    <meta name="google-adsense-account" content="ca-pub-7094672848897049" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "ArmFinCredit",
      "url": "https://www.armfincredit.site/",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "Any",
      "inLanguage": ["hy", "ru", "en"],
      "offers": [
        { "@type": "Offer", "price": "0", "priceCurrency": "USD", "name": "Free" },
        { "@type": "Offer", "price": "1.99", "priceCurrency": "USD", "name": "Pro monthly" },
        { "@type": "Offer", "price": "9.99", "priceCurrency": "USD", "name": "Pro lifetime" }
      ]
    }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block" rel="stylesheet" />

    <!-- Apply the saved theme before first paint to avoid a light flash -->
    <script>
      try {
        var th = localStorage.getItem('afc_theme');
        if (th === 'dark' || (!th && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
