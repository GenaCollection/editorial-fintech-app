name: CI

# Runs the tests and the full build (with prerendering) on every push and PR.
# Vercel runs the same `npm run build`, so a red check here means the deploy
# would fail too.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
